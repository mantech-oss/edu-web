apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-web-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <실습 환경의 StorageClass 이름>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-web
  template:
    metadata:
      labels:
        app: training-web
    spec:
      containers:
        - name: web
          image: YOUR_REGISTRY/k8s-training-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: training-web
            - name: SERVICE_PORT
              value: "80"
            - name: VOLUME_PATH
              value: /volume
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: training-volume
              mountPath: /volume
          readinessProbe:
            httpGet:
              path: /api/info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/info
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: training-volume
          persistentVolumeClaim:
            claimName: training-web-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: training-web
spec:
  selector:
    app: training-web
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: training-web
spec:
  # ingressClassName: nginx   # 환경에 맞게 수정
  rules:
    - host: training.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: training-web
                port:
                  number: 80
